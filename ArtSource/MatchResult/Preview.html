<!doctype html><html lang="ko"><meta charset="utf-8"><title>승리 · 패배 애니메이션</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d1e;color:white;font-family:Arial,sans-serif;overflow:hidden}main{height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse,#293549 0%,#080d1e 70%)}.stage{position:relative;width:min(840px,85vw);aspect-ratio:12/7}.wing{position:absolute;top:0;width:50%;height:100%;transform-origin:100% 100%;animation:left 1.6s ease-out both,sway 5s 1.6s ease-in-out infinite alternate}.right{left:50%;transform-origin:0 100%;animation-name:right,sway}.title{position:absolute;inset:34% 0 auto;text-align:center;color:#f7d989;font-size:clamp(40px,6vw,76px);font-weight:bold;animation:fade 1.5s both;text-shadow:0 2px 18px #000}.title small{display:block;font-size:17px;letter-spacing:8px;margin-top:18px;color:#ddd}.petal{position:absolute;width:20px;height:20px;background:url('../../Assets/Resources/MatchResult/Petal.png') center/contain;animation:fall 7s linear infinite}.defeat .wing{animation-duration:2.2s,7s}.defeat .title{color:#b8c7ff}nav{position:fixed;bottom:24px;left:0;right:0;text-align:center}button{border:1px solid #69768f;background:#1b263e;color:white;border-radius:8px;padding:12px 24px;margin:4px;cursor:pointer}@keyframes left{from{opacity:0;transform:scaleX(.3) rotate(-32deg)}to{opacity:1;transform:none}}@keyframes right{from{opacity:0;transform:scaleX(.3) rotate(32deg)}to{opacity:1;transform:none}}@keyframes sway{to{transform:rotate(1.3deg)}}@keyframes fade{0%,40%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}@keyframes fall{from{transform:translate(0,-140px) rotate(0);opacity:0}20%,80%{opacity:.8}to{transform:translate(65px,450px) rotate(330deg);opacity:0}}
</style><main><div id="host"></div></main><nav><button onclick="play(false)">승리 재생</button><button onclick="play(true)">패배 재생</button></nav><script>
function play(defeat){document.getElementById('host').innerHTML=`<div class="stage ${defeat?'defeat':''}"><img class="wing" src="../../Assets/Resources/MatchResult/${defeat?"Defeat":"Victory"}Left.png"><img class="wing right" src="../../Assets/Resources/MatchResult/${defeat?"Defeat":"Victory"}Right.png"><div class="title">${defeat?'패배':'승리'}<small>${defeat?'DEFEAT':'VICTORY'}</small></div>${Array.from({length:28},(_,i)=>`<i class="petal" style="left:${(i*37)%100}%;top:0;animation-delay:${-i*.27}s"></i>`).join('')}</div>`}play(false);
</script></html>
